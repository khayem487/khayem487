<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Code, in motion.</title>
  <desc id="desc">Public GitHub statistics: 465 commits in the last year, 16 stars earned, 14 owned public non-fork repositories including the portfolio and profile, 10 curated web demos, and second place at Hackathon IA.</desc>
