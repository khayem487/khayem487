    <circle cx="465" cy="0" r="125" fill="#8b5cf6" opacity=".055"/>
    <circle cx="20" cy="330" r="110" fill="#06b6d4" opacity=".04"/>
    <path d="M29 1h90" stroke="url(#accent)" stroke-width="3"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
