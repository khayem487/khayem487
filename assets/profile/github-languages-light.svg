<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Behind the builds.</title>
  <desc id="desc">Public repository language distribution: Java 31.16%, Python 27.25%, JavaScript 24.01%, HTML 8.60%, CSS 5.94%, PowerShell 3.04%</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f8ff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#dbe3f5"/></pattern>
    <clipPath id="card"><rect x="1" y="1" width="478" height="318" rx="22"/></clipPath>
    <clipPath id="bar"><rect x="28" y="116" width="424" height="14" rx="7"/></clipPath>
  </defs>
  <rect x="1" y="1" width="478" height="318" rx="22" fill="url(#bg)" stroke="#d6def0"/>
  <g clip-path="url(#card)">
    <rect width="480" height="320" fill="url(#dots)"/>
    <circle cx="465" cy="0" r="125" fill="#8b5cf6" opacity=".055"/>
    <circle cx="20" cy="330" r="110" fill="#06b6d4" opacity=".04"/>
    <path d="M29 1h90" stroke="url(#accent)" stroke-width="3"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="28" y="34" fill="#7c3aed" font-size="10" font-weight="700" letter-spacing="1.8">02 / CODE PALETTE</text>
    <text x="28" y="71" fill="#17233c" font-size="28" font-weight="750" letter-spacing="-.8">Behind the builds.</text>
    <rect x="404" y="22" width="48" height="48" rx="15" fill="#ffffff" stroke="#d6def0"/>
    <g transform="translate(416 34)" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10m6 10V4m6 16v-7m6 7V7"/></g>
    <text x="28" y="95" fill="#52637e" font-size="12">Most used languages in public repositories</text><rect x="28.000" y="116" width="132.118" height="14" fill="#8b5cf6" clip-path="url(#bar)"/><circle cx="32" cy="166" r="4" fill="#8b5cf6"/>
    <text data-testid="lang-name" x="45" y="171" fill="#17233c" font-size="13" font-weight="600"><tspan>Java </tspan><tspan x="230" text-anchor="end" fill="#52637e" font-size="12" font-weight="400">31.16%</tspan></text><rect x="160.118" y="116" width="115.540" height="14" fill="#06b6d4" clip-path="url(#bar)"/><circle cx="32" cy="209" r="4" fill="#06b6d4"/>
    <text data-testid="lang-name" x="45" y="214" fill="#17233c" font-size="13" font-weight="600"><tspan>Python </tspan><tspan x="230" text-anchor="end" fill="#52637e" font-size="12" font-weight="400">27.25%</tspan></text><rect x="275.658" y="116" width="101.802" height="14" fill="#3b82f6" clip-path="url(#bar)"/><circle cx="32" cy="252" r="4" fill="#3b82f6"/>
    <text data-testid="lang-name" x="45" y="257" fill="#17233c" font-size="13" font-weight="600"><tspan>JavaScript </tspan><tspan x="230" text-anchor="end" fill="#52637e" font-size="12" font-weight="400">24.01%</tspan></text><rect x="377.461" y="116" width="36.464" height="14" fill="#f97316" clip-path="url(#bar)"/><circle cx="254" cy="166" r="4" fill="#f97316"/>
    <text data-testid="lang-name" x="267" y="171" fill="#17233c" font-size="13" font-weight="600"><tspan>HTML </tspan><tspan x="452" text-anchor="end" fill="#52637e" font-size="12" font-weight="400">8.60%</tspan></text><rect x="413.925" y="116" width="25.186" height="14" fill="#10b981" clip-path="url(#bar)"/><circle cx="254" cy="209" r="4" fill="#10b981"/>
    <text data-testid="lang-name" x="267" y="214" fill="#17233c" font-size="13" font-weight="600"><tspan>CSS </tspan><tspan x="452" text-anchor="end" fill="#52637e" font-size="12" font-weight="400">5.94%</tspan></text><rect x="439.110" y="116" width="12.890" height="14" fill="#ec4899" clip-path="url(#bar)"/><circle cx="254" cy="252" r="4" fill="#ec4899"/>
    <text data-testid="lang-name" x="267" y="257" fill="#17233c" font-size="13" font-weight="600"><tspan>PowerShell </tspan><tspan x="452" text-anchor="end" fill="#52637e" font-size="12" font-weight="400">3.04%</tspan></text><path d="M28 285h424" stroke="#d6def0"/>
    <text x="28" y="305" fill="#52637e" font-size="10">By code size · selected languages, not proficiency</text>
  </g>
