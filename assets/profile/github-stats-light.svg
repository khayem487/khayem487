<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Code, in motion.</title>
  <desc id="desc">Public GitHub statistics: 465 commits in the last year, 16 stars earned, 1 pull requests, 2 issues, 2 repositories contributed to in the last year.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f8ff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#dbe3f5"/></pattern>
    <clipPath id="card"><rect x="1" y="1" width="478" height="318" rx="22"/></clipPath>
    <clipPath id="bar"><rect x="28" y="116" width="424" height="14" rx="7"/></clipPath>
  </defs>
  <rect x="1" y="1" width="478" height="318" rx="22" fill="url(#bg)" stroke="#d6def0"/>
  <g clip-path="url(#card)">
    <rect width="480" height="320" fill="url(#dots)"/>
    <circle cx="465" cy="0" r="125" fill="#8b5cf6" opacity=".055"/>
    <circle cx="20" cy="330" r="110" fill="#06b6d4" opacity=".04"/>
    <path d="M29 1h90" stroke="url(#accent)" stroke-width="3"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="28" y="34" fill="#7c3aed" font-size="10" font-weight="700" letter-spacing="1.8">01 / OPEN SOURCE</text>
    <text x="28" y="71" fill="#17233c" font-size="28" font-weight="750" letter-spacing="-.8">Code, in motion.</text>
    <rect x="404" y="22" width="48" height="48" rx="15" fill="#ffffff" stroke="#d6def0"/>
    <g transform="translate(416 34)" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5-6 7 6 7m8-14 6 7-6 7m-3-16-3 18"/></g>
    <rect x="28" y="99" width="202" height="108" rx="16" fill="#ffffff" stroke="#d6def0"/>
    <text x="46" y="156" data-testid="commits" fill="#7c3aed" font-size="46" font-weight="750" letter-spacing="-1.5">465</text>
    <text x="47" y="183" fill="#52637e" font-size="12" font-weight="600">Commits · last year</text><rect x="250" y="99" width="202" height="108" rx="16" fill="#ffffff" stroke="#d6def0"/>
    <text x="268" y="156" data-testid="stars" fill="#0e7490" font-size="46" font-weight="750" letter-spacing="-1.5">16</text>
    <text x="269" y="183" fill="#52637e" font-size="12" font-weight="600">Stars earned</text><text x="28" y="246" data-testid="prs" fill="#17233c" font-size="26" font-weight="700">1</text>
    <text x="28" y="267" fill="#52637e" font-size="11">Pull requests</text><text x="178" y="246" data-testid="issues" fill="#17233c" font-size="26" font-weight="700">2</text>
    <text x="178" y="267" fill="#52637e" font-size="11">Issues</text><text x="316" y="246" data-testid="contribs" fill="#17233c" font-size="26" font-weight="700">2</text>
    <text x="316" y="267" fill="#52637e" font-size="11">Repos · last year</text><path d="M28 285h424" stroke="#d6def0"/>
    <circle cx="32" cy="302" r="3" fill="#0e7490"/>
    <text x="43" y="305" fill="#52637e" font-size="10">Public GitHub activity</text>
    <text x="452" y="305" text-anchor="end" fill="#52637e" font-size="10">@khayem487</text>
